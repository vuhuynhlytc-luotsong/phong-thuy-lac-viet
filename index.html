<!doctype html>
<html lang="vi"><link rel="icon" type="image/png" href="favicon.png"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch Âm và Ngày Tốt Xấu</title>
<style>
:root{--bg:#f2f2f0;--card:#fff;--ink:#241b1b;--mute:#6b6060;--line:#ddd6d3;--red:#b3202f;--gold:#9a6b00;--good:#1b7a3d;--goodbg:#dff2e5;--bad:#a3162a;--badbg:#f8dfe2;--mid:#8a7a5a;--sel:#fff3d1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171313;--card:#221c1c;--ink:#f1e9e7;--mute:#a89b98;--line:#3a3030;--red:#ff7b87;--gold:#e0b04a;--good:#58d08a;--goodbg:#173a25;--bad:#ff8592;--badbg:#44181e;--mid:#c9b88a;--sel:#4a3a12}}
:root[data-theme="dark"]{--bg:#171313;--card:#221c1c;--ink:#f1e9e7;--mute:#a89b98;--line:#3a3030;--red:#ff7b87;--gold:#e0b04a;--good:#58d08a;--goodbg:#173a25;--bad:#ff8592;--badbg:#44181e;--mid:#c9b88a;--sel:#4a3a12}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
h1{grid-column:1/-1;margin:0;font-size:26px;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-weight:600;color:var(--mute);font-size:14px;padding:4px 0}
.wd:last-child,.c:nth-child(7n){color:var(--red)}
.c{position:relative;min-height:64px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:4px;text-align:center;line-height:1.15}
.c b{display:block;font-size:20px}
.c small{display:block;font-size:12px;color:var(--mute)}
.c.m1 small,.c.rm small{color:var(--gold);font-weight:600}
.c.e{visibility:hidden}
.c.tot{background:var(--goodbg)}.c.xau{background:var(--badbg)}
.c.td{border:2px solid var(--red)}
.c.sel{outline:3px solid var(--gold);background:var(--sel)}
.c i{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%}
.c.tot i{background:var(--good)}.c.xau i{background:var(--bad)}
.c.hol::after{content:"";position:absolute;left:5px;top:5px;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--mute)}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--mid)}
.leg .g::before{background:var(--good)}.leg .b::before{background:var(--bad)}.leg .h::before{border-radius:0;transform:rotate(45deg) scale(.8);background:var(--gold)}
#d h2{margin:0;font-size:20px}
#d .lun{font-size:24px;font-weight:700;color:var(--red);margin:2px 0 8px}
.badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;margin:4px 0 10px}
.badge.tot{background:var(--goodbg);color:var(--good)}.badge.xau{background:var(--badbg);color:var(--bad)}.badge.tb{background:var(--line);color:var(--ink)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
dt{color:var(--mute)}dd{margin:0}
.hrs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.hrs span{background:var(--goodbg);color:var(--good);border-radius:6px;padding:2px 8px;font-size:15px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.t{grid-column:1/-1}.t h2{margin:0 0 4px;font-size:20px;color:var(--red)}
.frm{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0}
.frm label{display:flex;flex-direction:column;font-size:14px;color:var(--mute)}
input[type=number]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;width:130px}
input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pri{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
.ok{color:var(--good)}.no{color:var(--bad);font-weight:600}
.tw{overflow-x:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}th{color:var(--mute);font-weight:600}
@media(max-width:760px){main{grid-template-columns:1fr}.c{min-height:54px}.c b{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>Lịch Âm và Ngày Tốt Xấu</h1>
<section class="card">
 <div class="bar">
  <button id="pv" aria-label="Tháng trước">&lsaquo; Trước</button>
  <select id="sm" aria-label="Tháng"></select><select id="sy" aria-label="Năm"></select>
  <button id="nx" aria-label="Tháng sau">Sau &rsaquo;</button><span class="sp"></span><button id="tdy">Hôm nay</button>
 </div>
 <div class="grid" id="g"></div>
 <div class="leg"><span class="g">Ngày tốt</span><span class="b">Ngày xấu</span><span>Bình thường</span><span class="h">Ngày lễ</span></div>
</section>
<section class="card" id="d" aria-live="polite"></section>
<section class="card t" id="tuoi">
 <h2>Xem tuổi: năm tốt hay xấu</h2>
 <div class="note" style="margin:0">Nhập năm sinh (dương lịch) và năm muốn xem, ví dụ để làm nhà, cưới hỏi, làm ăn.</div>
 <div class="frm">
  <label>Năm sinh<input type="number" id="by" min="1900" max="2150" placeholder="1990" inputmode="numeric"></label>
  <label>Năm cần xem<input type="number" id="ty" min="1900" max="2200" inputmode="numeric"></label>
  <button class="pri" id="xem">Xem tuổi</button>
 </div>
 <div id="tout" aria-live="polite"></div>
</section>
<script>
const $=id=>document.getElementById(id),INT=Math.floor,TZ=7;
function jdFromDate(d,m,y){let a=INT((14-m)/12),yy=y+4800-a,mm=m+12*a-3;let j=d+INT((153*mm+2)/5)+365*yy+INT(yy/4)-INT(yy/100)+INT(yy/400)-32045;if(j<2299161)j=d+INT((153*mm+2)/5)+365*yy+INT(yy/4)-32083;return j}
function NewMoon(k){const T=k/1236.85,T2=T*T,T3=T2*T,r=Math.PI/180;let J=2415020.75933+29.53058868*k+0.0001178*T2-0.000000155*T3;J+=0.00033*Math.sin((166.56+132.87*T-0.009173*T2)*r);
 const M=359.2242+29.10535608*k-0.0000333*T2-0.00000347*T3,P=306.0253+385.81691806*k+0.0107306*T2+0.00001236*T3,F=21.2964+390.67050646*k-0.0016528*T2-0.00000239*T3,s=Math.sin;
 let C=(0.1734-0.000393*T)*s(M*r)+0.0021*s(2*r*M);C-=0.4068*s(P*r)+0.0161*s(r*2*P);C-=0.0004*s(r*3*P);C+=0.0104*s(r*2*F)-0.0051*s(r*(M+P));C-=0.0074*s(r*(M-P))+0.0004*s(r*(2*F+M));C-=0.0004*s(r*(2*F-M))-0.0006*s(r*(2*F+P));C+=0.0010*s(r*(2*F-P))+0.0005*s(r*(2*P+M));
 const dt=T<-11?0.001+0.000839*T+0.0002261*T2-0.00000845*T3-0.000000081*T*T3:-0.000278+0.000265*T+0.000262*T2;return J+C-dt}
function sunLon(j){const T=(j-2451545.5)/36525,T2=T*T,r=Math.PI/180,M=357.52910+35999.05030*T-0.0001559*T2-0.00000048*T*T2,L0=280.46645+36000.76983*T+0.0003032*T2;
 let D=(1.914600-0.004817*T-0.000014*T2)*Math.sin(r*M)+(0.019993-0.000101*T)*Math.sin(r*2*M)+0.000290*Math.sin(r*3*M),L=(L0+D)*r;return L-Math.PI*2*INT(L/(Math.PI*2))}
const sl=j=>INT(sunLon(j-0.5-TZ/24)/Math.PI*6),nmd=k=>INT(NewMoon(k)+0.5+TZ/24);
function m11(y){const k=INT((jdFromDate(31,12,y)-2415021)/29.530588853);let n=nmd(k);if(sl(n)>=9)n=nmd(k-1);return n}
function leapOff(a){const k=INT((a-2415021.076998695)/29.530588853+0.5);let l,i=1,r=sl(nmd(k+i));do{l=r;i++;r=sl(nmd(k+i))}while(r!=l&&i<14);return i-1}
function solar2lunar(d,m,y){const dn=jdFromDate(d,m,y),k=INT((dn-2415021.076998695)/29.530588853);let ms=nmd(k+1);if(ms>dn)ms=nmd(k);
 let a=m11(y),b=a,ly;if(a>=ms){ly=y;a=m11(y-1)}else{ly=y+1;b=m11(y+1)}
 const ld=dn-ms+1,df=INT((ms-a)/29);let leap=0,lm=df+11;if(b-a>365){const lo=leapOff(a);if(df>=lo){lm=df+10;if(df==lo)leap=1}}
 if(lm>12)lm-=12;if(lm>=11&&df<4)ly-=1;return[ld,lm,ly,leap]}
const CAN="Giáp Ất Bính Đinh Mậu Kỷ Canh Tân Nhâm Quý".split(" "),CHI="Tý Sửu Dần Mão Thìn Tỵ Ngọ Mùi Thân Dậu Tuất Hợi".split(" ");
const TRUC="Kiến Trừ Mãn Bình Định Chấp Phá Nguy Thành Thu Khai Bế".split(" "),TQ=[2,1,2,2,2,1,0,0,2,1,2,0];
const TH={Kiến:["khởi sự, xuất hành","động thổ lớn"],Trừ:["dọn dẹp, chữa bệnh","cưới hỏi, khai trương"],Mãn:["cúng lễ, cầu tài","việc kiện tụng"],Bình:["việc thường ngày","việc trọng đại"],Định:["cưới hỏi, ký kết","kiện tụng, đi xa"],Chấp:["việc nhỏ, bắt đầu việc dở","khai trương, di chuyển lớn"],Phá:["phá dỡ, dọn bỏ đồ cũ","cưới hỏi, ký kết, khai trương"],Nguy:["cúng lễ, giữ gìn","đi xa, leo cao, việc mạo hiểm"],Thành:["khai trương, cưới hỏi, ký kết","kiện tụng"],Thu:["thu hoạch, đòi nợ","an táng, khởi công"],Khai:["khai trương, mở cửa hàng, xuất hành","an táng"],Bế:["nghỉ ngơi, lấp đắp","khai trương, cưới hỏi, đi xa"]};
const STAR=["Thanh Long","Minh Đường","Thiên Hình","Chu Tước","Kim Quỹ","Bảo Quang","Bạch Hổ","Ngọc Đường","Thiên Lao","Huyền Vũ","Tư Mệnh","Câu Trần"],HD=[1,1,0,0,1,1,0,1,0,0,1,0],START=[0,2,4,6,8,10,0,2,4,6,8,10];
const GH=[[0,1,3,6,8,9],[2,3,5,8,10,11],[0,1,4,5,7,10],[0,2,3,6,7,9],[2,4,5,8,9,11],[1,4,6,7,10,11]],GT="23-1|1-3|3-5|5-7|7-9|9-11|11-13|13-15|15-17|17-19|19-21|21-23".split("|");
const LH={"1/1":"Tết Nguyên Đán","15/1":"Rằm tháng Giêng","10/3":"Giỗ Tổ Hùng Vương","15/4":"Lễ Phật Đản","5/5":"Tết Đoan Ngọ","15/7":"Vu Lan","15/8":"Tết Trung Thu","23/12":"Ông Táo chầu trời"},
SH={"1/1":"Tết Dương lịch","8/3":"Quốc tế Phụ nữ","30/4":"Giải phóng miền Nam","1/5":"Quốc tế Lao động","2/9":"Quốc khánh","20/10":"Phụ nữ Việt Nam","20/11":"Ngày Nhà giáo VN","24/12":"Đêm Giáng sinh"};
const memo={};
function info(d,m,y){const key=d+"/"+m+"/"+y;if(memo[key])return memo[key];
 const jd=jdFromDate(d,m,y),[ld,lm,ly,lp]=solar2lunar(d,m,y),can=(jd+9)%10,chi=(jd+1)%12;
 const deg=sunLon(jd-0.5-TZ/24)*180/Math.PI,mc=(INT(((deg+45)%360)/30)+2)%12,tr=(chi-mc+12)%12;
 const si=(chi-START[lm-1]+12)%12,hoang=HD[si];let sc=(hoang?2:0)+(TQ[tr]==2?2:TQ[tr]==1?1:-1);
 const tam=[3,7,13,18,22,27].includes(ld),ky=[5,14,23].includes(ld);if(tam)sc-=2;if(ky)sc-=1;
 const v=sc>=3?"tot":sc<=0?"xau":"tb",lk=lp?0:1;
 const hol=[(lk&&LH[ld+"/"+lm])||"",SH[d+"/"+m]||""].filter(Boolean);
 return memo[key]={jd,ld,lm,ly,lp,can,chi,tr,si,hoang,tam,ky,v,hol}}
const cc=(c,h)=>CAN[c]+" "+CHI[h];
const now=new Date();let Y=now.getFullYear(),M=now.getMonth()+1,SEL=[now.getDate(),M,Y];
const WD=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"],VT={tot:"Ngày tốt",xau:"Ngày xấu",tb:"Bình thường"};
$("sm").innerHTML=Array.from({length:12},(_,i)=>`<option value="${i+1}">Tháng ${i+1}</option>`).join("");
$("sy").innerHTML=Array.from({length:201},(_,i)=>`<option>${1950+i}</option>`).join("");
function render(){$("sm").value=M;$("sy").value=Y;
 let h=["T2","T3","T4","T5","T6","T7","CN"].map(x=>`<div class="wd">${x}</div>`).join("");
 const off=(new Date(Y,M-1,1).getDay()+6)%7,n=new Date(Y,M,0).getDate();h+='<div class="c e"></div>'.repeat(off);
 for(let d=1;d<=n;d++){const f=info(d,M,Y),t=d==now.getDate()&&M==now.getMonth()+1&&Y==now.getFullYear(),s=SEL[0]==d&&SEL[1]==M&&SEL[2]==Y;
  h+=`<button class="c ${f.v} ${t?"td":""} ${s?"sel":""} ${f.ld==1?"m1":""} ${f.ld==15?"rm":""} ${f.hol.length?"hol":""}" data-d="${d}" aria-label="${d}/${M}/${Y}, ${VT[f.v]}"><i></i><b>${d}</b><small>${f.ld==1?f.ld+"/"+f.lm:f.ld}</small></button>`}
 $("g").innerHTML=h;detail()}
function detail(){const[d,m,y]=SEL,f=info(d,m,y),wd=new Date(y,m-1,d).getDay(),tn=TRUC[f.tr],hs=GH[f.chi%6],yc=(f.ly+6)%10,yh=(f.ly+8)%12,mc=((yc*2+f.lm+1)%10+10)%10;
 $("d").innerHTML=`<h2>${WD[wd]}, ${d}/${m}/${y}</h2>
 <div class="lun">Ngày ${f.ld} tháng ${f.lm}${f.lp?" nhuận":""} âm lịch</div>
 <div class="badge ${f.v}">${VT[f.v]}${f.hoang?" (Hoàng đạo)":" (Hắc đạo)"}</div>
 <dl><dt>Ngày</dt><dd>${cc(f.can,f.chi)}</dd><dt>Tháng</dt><dd>${cc(mc,(f.lm+1)%12)}</dd><dt>Năm</dt><dd>${cc(yc,yh)}</dd><dt>Trực</dt><dd>${tn}</dd><dt>Sao</dt><dd>${STAR[f.si]}</dd>
 <dt>Nên làm</dt><dd>${TH[tn][0]}</dd><dt>Nên tránh</dt><dd>${TH[tn][1]}${f.tam?"; ngày Tam nương":""}${f.ky?"; ngày Nguyệt kỵ":""}</dd>${f.hol.length?`<dt>Ngày lễ</dt><dd>${f.hol.join(", ")}</dd>`:""}</dl>
 <div class="note" style="margin:10px 0 0">Giờ Hoàng đạo</div><div class="hrs">${hs.map(i=>`<span>${CHI[i]} (${GT[i]}h)</span>`).join("")}</div>
 <div class="note">Chỉ mang tính tham khảo theo quan niệm dân gian. Ngày xấu theo lịch không có nghĩa là bạn không được làm việc cần thiết.</div>`}
$("g").onclick=e=>{const b=e.target.closest(".c[data-d]");if(b){SEL=[+b.dataset.d,M,Y];render()}};
const go=n=>{M+=n;if(M>12){M=1;Y++}if(M<1){M=12;Y--}SEL=[1,M,Y];render()};
$("pv").onclick=()=>go(-1);$("nx").onclick=()=>go(1);
$("sm").onchange=e=>{M=+e.target.value;SEL=[1,M,Y];render()};$("sy").onchange=e=>{Y=+e.target.value;SEL=[1,M,Y];render()};
$("tdy").onclick=()=>{Y=now.getFullYear();M=now.getMonth()+1;SEL=[now.getDate(),M,Y];render()};
const NA="Hải Trung Kim|Lô Trung Hỏa|Đại Lâm Mộc|Lộ Bàng Thổ|Kiếm Phong Kim|Sơn Đầu Hỏa|Giản Hạ Thủy|Thành Đầu Thổ|Bạch Lạp Kim|Dương Liễu Mộc|Tuyền Trung Thủy|Ốc Thượng Thổ|Tích Lịch Hỏa|Tùng Bách Mộc|Trường Lưu Thủy|Sa Trung Kim|Sơn Hạ Hỏa|Bình Địa Mộc|Bích Thượng Thổ|Kim Bạch Kim|Phú Đăng Hỏa|Thiên Hà Thủy|Đại Dịch Thổ|Thoa Xuyến Kim|Tang Đố Mộc|Đại Khê Thủy|Sa Trung Thổ|Thiên Thượng Hỏa|Thạch Lựu Mộc|Đại Hải Thủy".split("|");
const HOANG=[["Nhất Kiết",1],["Nhì Nghi",1],["Tam Địa Sát",0],["Tứ Tấn Tài",1],["Ngũ Thọ Tử",0],["Lục Hoang Ốc",0]],TTY={0:[2,3,4],2:[8,9,10],1:[11,0,1],3:[5,6,7]};
const SINH={Kim:"Thủy",Thủy:"Mộc",Mộc:"Hỏa",Hỏa:"Thổ",Thổ:"Kim"},KHAC={Kim:"Mộc",Mộc:"Thổ",Thổ:"Thủy",Thủy:"Hỏa",Hỏa:"Kim"};
function napAm(y){const c=(y+6)%10,h=(y+8)%12;for(let n=0;n<60;n++)if(n%10==c&&n%12==h)return NA[INT(n/2)]}
function calc(by,ty){const age=ty-by+1,chi=(by+8)%12,cy=(ty+8)%12,r=age%9,k=[1,3,6,8].indexOf(r),ho=HOANG[INT((age-1)/10)%6],tt=TTY[chi%4].indexOf(cy),d=(cy-chi+12)%12,s=(chi+cy)%12;
 let tue="Bình hòa",tb=0;if(d==0){tue="Trực Thái Tuế (trùng tuổi)";tb=1}else if(d==6){tue="Xung Thái Tuế";tb=1}else if(s==1){tue="Lục hợp, thuận lợi"}else if(d==4||d==8){tue="Tam hợp, thuận lợi"}else if(s==7){tue="Tương hại (nhẹ)";tb=1}
 const kl=k>=0?["Thân","Thê","Tử","Lục súc"][k]:null;return{age,chi,kl,ho,tt,tue,tb,bad:(kl?1:0)+(ho[1]?0:1)+(tt>=0?1:0)+tb}}
const yv=c=>c.bad==0?"tot":c.bad==1?"tb":"xau",YL={tot:"Năm tốt",tb:"Năm bình thường, cần thận trọng",xau:"Năm nhiều trở ngại"};
const yc=y=>cc((y+6)%10,(y+8)%12),yes=(b,t,f)=>b?`<span class="ok">${t}</span>`:`<span class="no">${f}</span>`;
function tuoi(){const by=+$("by").value,ty=+$("ty").value,o=$("tout");
 if(!(by>=1900&&by<=2150)||!(ty>=1900&&ty<=2200)||ty<by){o.innerHTML='<p class="note">Vui lòng nhập năm sinh (ví dụ 1990) và năm cần xem hợp lệ, năm xem không nhỏ hơn năm sinh.</p>';return}
 try{localStorage.setItem("by",by)}catch(e){}
 const c=calc(by,ty),mp=napAm(by),my=napAm(ty),hp=mp.split(" ").pop(),hy=my.split(" ").pop(),v=yv(c);
 const rel=hp==hy?"Cùng hành, bình thường":SINH[hy]==hp?"Hành của năm sinh mệnh bạn (thuận)":SINH[hp]==hy?"Mệnh bạn sinh hành của năm (hao sức)":KHAC[hy]==hp?"Hành của năm khắc mệnh bạn (kém)":"Mệnh bạn khắc hành của năm (tạm được)";
 const nha=!c.kl&&c.ho[1]&&c.tt<0,cuoi=!c.kl&&c.tt<0,an=!c.tb&&c.tt<0;
 let rows="";for(let i=0;i<6;i++){const y=ty+i,z=calc(by,y),p=[];if(z.kl)p.push("Kim Lâu");if(!z.ho[1])p.push("Hoang Ốc");if(z.tt>=0)p.push("Tam Tai");if(z.tb)p.push(z.tue.split(" (")[0]);
  rows+=`<tr><td>${y}</td><td>${yc(y)}</td><td>${z.age}</td><td>${p.join(", ")||"Không phạm"}</td><td><span class="badge ${yv(z)}" style="margin:0;padding:2px 10px">${YL[yv(z)].split(",")[0]}</span></td></tr>`}
 o.innerHTML=`<div class="lun" style="font-size:22px;font-weight:700;color:var(--red)">Tuổi ${yc(by)} (${mp})</div>
 <div class="badge ${v}">Năm ${ty} (${yc(ty)}): ${YL[v]}</div>
 <dl><dt>Tuổi âm</dt><dd>${c.age} tuổi</dd>
 <dt>Kim Lâu</dt><dd>${yes(!c.kl,"Không phạm","Phạm Kim Lâu ("+c.kl+")")}</dd>
 <dt>Hoang Ốc</dt><dd>${yes(c.ho[1],"Cung "+c.ho[0]+" (tốt)","Cung "+c.ho[0]+" (xấu)")}</dd>
 <dt>Tam Tai</dt><dd>${yes(c.tt<0,"Không phạm","Phạm Tam Tai (năm thứ "+(c.tt+1)+"/3)")}</dd>
 <dt>Thái Tuế</dt><dd>${yes(!c.tb,c.tue,c.tue)}</dd>
 <dt>Ngũ hành</dt><dd>Mệnh ${hp}, năm ${ty} hành ${hy}: ${rel}</dd>
 <dt>Làm nhà</dt><dd>${yes(nha,"Hợp","Nên tránh")}</dd><dt>Cưới hỏi</dt><dd>${yes(cuoi,"Hợp","Nên tránh")}</dd><dt>Làm ăn</dt><dd>${yes(an,"Hợp","Nên cân nhắc")}</dd></dl>
 <div class="tw"><table><thead><tr><th>Năm</th><th>Can Chi</th><th>Tuổi âm</th><th>Phạm</th><th>Kết luận</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="note">Cách tính dân gian (Kim Lâu, Hoang Ốc, Tam Tai, Thái Tuế, ngũ hành nạp âm), chỉ mang tính tham khảo. Tuổi âm tính theo năm, chưa xét ngày sinh trước hay sau Tết.</div>`}
$("ty").value=solar2lunar(now.getDate(),M,Y)[2];try{$("by").value=localStorage.getItem("by")||""}catch(e){}
$("xem").onclick=tuoi;[$("by"),$("ty")].forEach(e=>e.onkeydown=k=>{if(k.key==="Enter")tuoi()});
if($("by").value)tuoi();
render();
</script></main></body></html>
