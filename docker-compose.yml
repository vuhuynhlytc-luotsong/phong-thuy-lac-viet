name: phong-thuy-lac-viet
services:
  app:
    container_name: phong-thuy-lac-viet
    image: phong-thuy-lac-viet:local
    build: .
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN:?Hãy đặt ADMIN_TOKEN trong file .env}
      - TRUST_PROXY=${TRUST_PROXY:-0}     # đặt 1 nếu chạy sau nginx / Cloudflare
    volumes:
      - ./data:/app/data                  # key, phiên đăng nhập và sổ tay của mọi tài khoản
    restart: unless-stopped
