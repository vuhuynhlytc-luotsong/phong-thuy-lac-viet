services:
  app:
    build: .
    ports:
      - "18480:3000"
    environment:
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - UPDATE_BASE=https://raw.githubusercontent.com/<tài-khoản>/<repo>/main/public
      # - GITHUB_TOKEN=${GITHUB_TOKEN}   # chỉ cần nếu repo để private
    volumes:
      - ./data:/app/data
    restart: unless-stopped
