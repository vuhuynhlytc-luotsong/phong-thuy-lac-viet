name: phong-thuy-lac-viet
services:
  app:
    container_name: phong-thuy-lac-viet
    image: phong-thuy-lac-viet:local
    build: .
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      # Địa chỉ Worker giữ key Gemini cho chức năng hỏi đáp AI (bỏ trống thì tắt AI, hoặc đặt GEMINI_API_KEY)
      - AI_URL=${AI_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data                  # sổ tay của bạn
    restart: unless-stopped
