<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập - Phong Thủy Lạc Việt</title><link rel="icon" href="favicon.png">
<style>body{font-family:system-ui,sans-serif;background:#4b2a7b;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
.b{background:#fff;padding:28px;border-radius:14px;width:320px;max-width:92vw;text-align:center}
input,button{width:100%;padding:12px;margin-top:12px;box-sizing:border-box;border-radius:8px;border:1px solid #bbb;font-size:1.05em}
button{background:#d4a017;border:0;font-weight:700;cursor:pointer}#e{color:#c0392b;min-height:1.3em;margin-top:10px}small{color:#666;display:block;margin-top:6px}</style></head>
<body><div class="b"><img src="favicon.png" width="64" height="64" alt=""><h3>Phong Thủy Lạc Việt</h3>
<input id="k" placeholder="Nhập mã key" autocomplete="off" autocapitalize="characters" maxlength="14">
<button id="g">Đăng nhập</button><div id="e" role="alert"></div>
<small>Mỗi key chỉ dùng được trên một máy.</small><small id="v">Phiên bản …</small></div>
<script>
const k=document.getElementById('k'),e=document.getElementById('e');
let did;try{did=localStorage.getItem('did');if(!did){did=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('did',did)}}catch(x){did=String(Math.random()).slice(2)+Date.now()}
async function go(){e.textContent='';
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k.value,did:did})});
 if(r.ok)location.href='/';
 else e.textContent=r.status==429?'Nhập sai quá nhiều lần, thử lại sau 1 phút.':r.status==403?'Key này đã được dùng trên một máy khác. Liên hệ quản trị để đổi máy.':'Key không đúng hoặc đã hết hạn.'}
document.getElementById('g').onclick=go;k.onkeydown=ev=>{if(ev.key=='Enter')go()};
fetch("/api/version",{cache:"no-store"}).then(r=>r.json()).then(j=>{document.getElementById("v").textContent="Phiên bản v"+j.version}).catch(()=>{});
</script></body></html>
