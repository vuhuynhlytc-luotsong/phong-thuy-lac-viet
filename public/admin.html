<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Quản trị key - Phong Thủy Lạc Việt</title><link rel="icon" href="favicon.png">
<style>body{font-family:system-ui,sans-serif;background:#f2f2f0;color:#241b1b;margin:0;padding:16px}main{max-width:980px;margin:auto}
h1{font-size:22px;color:#4b2a7b}.c{background:#fff;border-radius:12px;padding:16px;margin:12px 0}
input,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid #bbb;margin:4px 4px 4px 0}button{cursor:pointer;background:#4b2a7b;color:#fff;border:0}
button.g{background:#fff;color:#4b2a7b;border:1px solid #4b2a7b;padding:4px 10px;font-size:14px}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}code{font-size:16px;font-weight:700}.nk{background:#dff2e5;border-radius:10px;padding:10px 14px;margin-top:8px}.er{color:#a3162a}</style></head>
<body><main><h1>Quản trị key – Phong Thủy Lạc Việt</h1>
<div class="c" id="lg"><input id="tk" type="password" placeholder="ADMIN_TOKEN" autocomplete="off"><button id="lgb">Đăng nhập quản trị</button><div class="er" id="le" role="alert"></div></div>
<div id="ad" hidden>
 <div class="c" id="up"><b>Cập nhật phiên bản</b><div id="us">Đang kiểm tra…</div><div id="um"></div>
  <button id="ucheck" class="g">Kiểm tra lại</button> <button id="ugo" hidden>Cập nhật ngay</button> <button id="urb" class="g" hidden>Quay lại bản trước</button></div>
 <div class="c"><b>Tạo key mới</b><br><input id="nm" placeholder="Tên khách" maxlength="80"> <input id="dy" type="number" min="0" value="30" style="width:90px"> ngày (0 = vô thời hạn) <button id="mk">Tạo key</button><div id="nk"></div></div>
 <div class="c tw"><table><thead><tr><th>Key</th><th>Tên</th><th>Hết hạn</th><th>Trạng thái</th><th>Máy</th><th>Đăng nhập gần nhất</th><th>Thao tác</th></tr></thead><tbody id="tb"></tbody></table></div>
 <button class="g" id="lo">Thoát quản trị</button>
</div></main>
<script>
const $=i=>document.getElementById(i);let T="";try{T=sessionStorage.getItem("at")||""}catch(e){}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view=on=>{$("lg").hidden=on;$("ad").hidden=!on};
async function api(p,b){const r=await fetch(p,{method:b?"POST":"GET",headers:{"x-admin-token":T,"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
 if(r.status==403||r.status==429){T="";try{sessionStorage.removeItem("at")}catch(e){}view(false);$("le").textContent=r.status==429?"Sai quá nhiều lần, thử lại sau 1 phút.":"Token không đúng.";throw new Error("auth")}return r.json()}
async function load(){const l=await api("/api/admin/list"),t=new Date().toISOString().slice(0,10);view(true);ust();
 $("tb").innerHTML=l.filter(Boolean)..map(k=>{const st=!k.active?"Đã thu hồi":k.expires&&k.expires<t?"Hết hạn":"Hoạt động",K=esc(k.key);
  return`<tr><td><code>${K}</code> <button class="g" data-c="${K}">Chép</button></td><td>${esc(k.name)}</td><td>${esc(k.expires||"Vô thời hạn")}</td><td>${st}</td><td>${k.bound?"Đã gắn 1 máy":"Chưa dùng"}</td><td>${esc(k.lastLogin?String(k.lastLogin).replace("T"," ").slice(0,16):"—")}</td><td>${k.active?`<button class="g" data-r="${K}">Thu hồi</button> `:`<button class="g" data-s="${K}">Khôi phục</button> `}${k.bound?`<button class="g" data-d="${K}">Đổi máy</button>`:""}</td></tr>`}).join("")||'<tr><td colspan="7">Chưa có key nào.</td></tr>'}
$("lgb").onclick=async()=>{T=$("tk").value.trim();$("tk").value="";$("le").textContent="";try{await load();sessionStorage.setItem("at",T)}catch(e){}};
$("mk").onclick=async()=>{const r=await api("/api/admin/create",{name:$("nm").value.trim(),days:+$("dy").value||0});
 $("nk").innerHTML=`<div class="nk">Key mới: <code>${esc(r.key)}</code> (${r.expires?"hết hạn "+esc(r.expires):"vô thời hạn"}) <button class="g" data-c="${esc(r.key)}">Chép</button></div>`;$("nm").value="";load()};
$("tb").onclick=$("nk").onclick=async e=>{const d=e.target.dataset||{};
 if(d.c){try{await navigator.clipboard.writeText(d.c);e.target.textContent="Đã chép"}catch(x){prompt("Sao chép key:",d.c)}}
 if(d.r&&confirm("Thu hồi key "+d.r+"? Người đang dùng sẽ bị đăng xuất.")){await api("/api/admin/revoke",{key:d.r});load()}
 if(d.d&&confirm("Cho key "+d.d+" đổi sang máy khác? Máy cũ sẽ bị đăng xuất.")){await api("/api/admin/unbind",{key:d.d});load()}
 if(d.s){await api("/api/admin/restore",{key:d.s});load()}};
async function ust(){$("us").textContent="Đang kiểm tra…";try{const s=await api("/api/admin/update-status");
 $("us").innerHTML="Đang chạy: <b>v"+esc(s.current)+"</b>"+(s.current!==s.bundled?" (bản gốc cài sẵn: v"+esc(s.bundled)+")":"")+(s.remote?" • Trên GitHub: <b>v"+esc(s.remote)+"</b>":"")+(s.error?'<br><span class="er">'+esc(s.error)+"</span>":"")+(s.note?"<br>Ghi chú: "+esc(s.note):"");
 $("ugo").hidden=!s.hasUpdate;$("ugo").textContent="Cập nhật lên v"+(s.remote||"");$("urb").hidden=!s.previous}catch(e){}}
$("ucheck").onclick=ust;
$("ugo").onclick=async()=>{if(!confirm("Cập nhật ngay? Người dùng sẽ thấy bản mới khi tải lại trang."))return;$("um").textContent="Đang cập nhật…";const r=await api("/api/admin/update",{});$("um").innerHTML=r.ok?'<span style="color:#1b7a3d">Đã cập nhật v'+esc(r.from)+" → v"+esc(r.to)+"</span>":'<span class="er">'+esc(r.error)+"</span>";ust()};
$("urb").onclick=async()=>{if(!confirm("Quay lại bản trước?"))return;const r=await api("/api/admin/rollback",{});$("um").innerHTML=r.ok?"Đã quay lại v"+esc(r.to):'<span class="er">'+esc(r.error)+"</span>";ust()};
$("lo").onclick=()=>{T="";try{sessionStorage.removeItem("at")}catch(e){}$("tb").innerHTML="";view(false)};
$("tk").onkeydown=e=>{if(e.key=="Enter")$("lgb").onclick()};
if(T)load().catch(()=>{});
</script></body></html>
