services:
  app:
    # THAY "TEN_GITHUB_CUA_BAN" bằng tên tài khoản GitHub (viết thường). Số phiên bản do ./release.sh tự cập nhật.
    image: ghcr.io/vuhuynhlytc-luotsong/phong-thuy-lac-viet:2.0
    restart: unless-stopped
    labels:
      pi.ui.primary: "true"
    ports:
      - "127.0.0.1:18480:3000"
    environment:
      - LICENSE_URL=https://phong-thuy-lac-viet.vuhuynh-lytc.workers.dev
      - UPDATE_BASE=https://raw.githubusercontent.com/vuhuynhlytc-luotsong/phong-thuy-lac-viet/main/public
    volumes:
      - lichamdata:/app/data
volumes:
  lichamdata:
